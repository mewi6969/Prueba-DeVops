<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor centrado">
    <h2>¡Bienvenido, <span id="nombre-usuario"></span>!</h2>
    <p class="subtitulo">Iniciaste sesión correctamente.</p>
    <button id="btn-salir">Cerrar sesión</button>
  </div>

  <script>
    // Recuperamos el usuario guardado al iniciar sesión
    const usuario = localStorage.getItem("usuarioActivo");

    if (!usuario) {
      // Si alguien entra directo a esta página sin loguearse, lo mandamos al login
      window.location.href = "login.html";
    } else {
      document.getElementById("nombre-usuario").textContent = usuario;
    }

    document.getElementById("btn-salir").addEventListener("click", function () {
      localStorage.removeItem("usuarioActivo");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
